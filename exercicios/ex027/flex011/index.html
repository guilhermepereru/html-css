<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Boxes</title>
    <style>
        div.conteiner {
            display: flex;
            flex-flow: row nowrap;


            background-color: aqua;
        }

        div.filho {
            border: 2px solid black;
            text-align: center;
            background-color: antiquewhite;

            flex-basis: 200px;   
        }
        div#cxaA {
            flex-shrink: 1;
            flex-grow: 0;
        }
        div#cxaB {
            flex-shrink: 1;
            flex-grow: 1;
        }
        div#cxaC {
            flex-shrink: 1;
            flex-grow: 0;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="filho" id="cxaA">A</div>
        <div class="filho" id="cxaB">B</div>
        <div class="filho" id="cxaC">C</div>
    </div>
</body>
</html>
