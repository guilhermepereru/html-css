<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Boxes</title>
    <style>
        div.conteiner {
            display: flex;
            flex-flow: row nowrap;
            background-color: aqua;
        }

        div.filho {
            
            border: 2px solid black;
            text-align: center;
            background-color: antiquewhite;
            flex-basis: 150px;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="filho">A</div>
        <div class="filho">Texto pequeno</div>
        <div class="filho">C</div>
        <div class="filho">Texto um pouco maior</div>
        <div class="filho">E</div>
        <div class="filho">F</div>
        <div class="filho">Texto maior ainda que vai quebrar a linha</div>
    </div>
</body>
</html>
